<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Music{% endblock %}</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <nav>
        <div class="navbar-title">Robert Winterburn</div>
        <div class="menu-icon" onclick="toggleMenu()">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
        </div>
        <ul class="nav-links">
            <li><a href="{{ url_for('index') }}" class="glow-button">Home</a></li>
            <li><a href="{{ url_for('resume') }}" class="glow-button">Resume</a></li>
            <li><a href="{{ url_for('showreel') }}" class="glow-button">Showreel</a></li>
            <li><a href="{{ url_for('Gallery') }}" class="glow-button">Gallery</a></li>
            <li><a href="{{ url_for('contact') }}" class="glow-button">Contact</a></li>
        </ul>
    </nav>

    <div class="container">
        {% block content %}
        <!-- Content will be inserted here -->
        {% endblock %}
    </div>
    
    <footer><a class="pill-link-twggPzND8A" href="https://app.spotlight.com/2619-1277-3451" tabIndex="0">
        <style>
        @import url(https://staticassets.spotlight.com/fonts/futura-pt/futura-pt_medium.woff2);

        .pill-link-twggPzND8A {
          text-decoration: none;
        }

        .pill-twggPzND8A {
          background-color: #5938bb;
          max-width: 100%;
          padding: 6px 10px 6px 4px;
          border-radius: 17.5px;
          display: -ms-inline-flexbox;
          display: inline-flex;
          -ms-flex-align: center;
          align-items: center;
          font-family: "Futura-PT", "Gill Sans", sans-serif;
        }

        .pill__icon-img-twggPzND8A {
          height: 27px;
        }

        .pill__children-container-twggPzND8A {
          font-size: 14px;
          color: #fff;
          padding-bottom: 1px;
          margin: 0 4px;
          overflow: hidden;
          -o-text-overflow: ellipsis;
          text-overflow: ellipsis;
          white-space: nowrap;
          font-weight: 500;
          text-transform: uppercase;
        }
      </style>
        <span class="pill-twggPzND8A">
          <span class="pill__icon-container-twggPzND8A">
            <img
              class="pill__icon-img-twggPzND8A"
              src="https://app.spotlight.com/profile/static/media/Spotlight-roundel-on-dark-bg.ba0f689fc7216b51062127a1ce62a6f5.svg"
              alt="icon"
            >
          </span>
          <span class="pill__children-container-twggPzND8A">
            Spotlight performer
          </span>
        </span>
      </a>
        <p>&copy; 2023 Robert Winterburn</p> 
    </footer>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
    
</body>
</html>
